#:schema https://supabase.com/schemas/config/v1.json

project_id = "predrive"

[functions.paynow-webhook]
# Paynow authenticates callbacks with its SHA-512 integration-key hash.
# The function verifies this itself; no Supabase user JWT is available.
verify_jwt = false

[functions.generate-payment-reminders]
# Scheduled invocation authenticates independently with CRON_SECRET.
verify_jwt = false
