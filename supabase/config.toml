#:schema https://supabase.com/schemas/config/v1.json

project_id = "predrive"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.paynow-webhook]
# Paynow authenticates callbacks with its SHA-512 integration-key hash.
# The function verifies this itself; no Supabase user JWT is available.
verify_jwt = false

[functions.generate-payment-reminders]
# Scheduled invocation authenticates independently with CRON_SECRET.
verify_jwt = false

[functions.deliver-notifications]
# Scheduled delivery worker authenticates independently with CRON_SECRET.
verify_jwt = false

[functions.enqueue-alert-escalations]
# Scheduled invocation authenticates independently with CRON_SECRET.
verify_jwt = false

[functions.process-data-exports]
# Scheduled worker authenticates independently with CRON_SECRET.
verify_jwt = false

[functions.run-approved-retention]
# Scheduled worker authenticates independently with CRON_SECRET.
verify_jwt = false

[functions.process-approved-deletions]
# Scheduled worker authenticates independently with CRON_SECRET.
verify_jwt = false
