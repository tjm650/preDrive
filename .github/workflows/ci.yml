name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preDrive-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,inbucket --ignore-health-check
      - run: supabase db reset
      - name: Generate database types
        run: |
          supabase gen types typescript --local > frontend/packages/shared/src/database.types.ts
          npx --yes prettier --write frontend/packages/shared/src/database.types.ts
      - name: Run pgTAP isolation suite
        run: supabase test db
      - uses: actions/upload-artifact@v4
        with:
          name: schema-types
          path: frontend/packages/shared/src/database.types.ts
      - if: always()
        run: supabase stop
  quality:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: schema-types
          path: frontend/packages/shared/src
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck all workspaces
        run: pnpm typecheck
      - name: Build web application
        run: pnpm --filter @predrive/web build
      - name: Bundle Android application
        run: pnpm --filter @predrive/mobile exec expo export --platform android
