name: Sync pnpm lockfile
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'frontend/**/package.json'
      - 'frontend/packages/shared/src/types.ts'
      - 'frontend/apps/web/src/app/dashboard/page.tsx'
      - 'frontend/apps/mobile/src/components/OperationsDashboard.tsx'
      - 'frontend/apps/web/src/app/dashboard/operations/page.tsx'
      - 'supabase/functions/**/index.ts'
      - '.github/workflows/sync-lockfile.yml'
permissions:
  contents: write
concurrency:
  group: preDrive-lockfile-main
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format authored source and generated configuration
        run: |
          pnpm exec prettier --write \
            frontend/apps/mobile/src/components/OperationsDashboard.tsx \
            frontend/apps/mobile/src/lib/offline.ts \
            frontend/apps/mobile/app/index.tsx \
            frontend/apps/mobile/package.json frontend/apps/mobile/app.json frontend/apps/mobile/eas.json \
            frontend/apps/web/src/app/dashboard/operations/page.tsx \
            frontend/apps/web/src/app/dashboard/page.tsx \
            frontend/packages/shared/src/types.ts \
            supabase/functions/invite-staff/index.ts supabase/functions/build-route-geometry/index.ts \
            README.md .github/workflows/ci.yml .github/workflows/sync-lockfile.yml
      - name: Commit lockfile and formatting changes
        run: |
          if git diff --quiet; then
            echo "Lockfile and formatting are already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync dependencies and formatting"
          git push origin HEAD:main
