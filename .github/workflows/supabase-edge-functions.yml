name: Supabase Edge Functions

on:
  push:
    paths:
      - "supabase/functions/**"
      - "scripts/seed-auth-users.ts"
      - "scripts/seed-auth-users_test.ts"
      - ".github/workflows/supabase-edge-functions.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-edge-runtime:
    name: Shared Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Type-check shared Edge Function modules, seed tooling and tests
        run: deno check --config=deno.json supabase/functions/_shared/*.ts supabase/functions/generate-daily-trips/index.ts supabase/functions/invite-school-member/index.ts supabase/functions/create-payment-intent/index.ts supabase/functions/paynow-webhook/index.ts supabase/functions/request-refund/index.ts supabase/functions/get-payment-receipt/index.ts supabase/functions/generate-payment-reminders/index.ts supabase/functions/deliver-notifications/index.ts supabase/functions/enqueue-alert-escalations/index.ts supabase/functions/process-data-exports/index.ts supabase/functions/download-data-export/index.ts supabase/functions/run-approved-retention/index.ts supabase/functions/process-approved-deletions/index.ts scripts/seed-auth-users.ts scripts/seed-auth-users_test.ts

      - name: Run shared Edge Function and demo seed tests
        run: deno test --config=deno.json --allow-net supabase/functions/_shared scripts/seed-auth-users_test.ts
